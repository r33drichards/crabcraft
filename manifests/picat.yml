# Picat as a WARM crabcraft workload (picatd-style): the worker boots one
# Picat session at deploy and keeps it alive; each invoke loads your program
# into the live REPL and runs main - no per-call runtime boot.
name: picat
wasm: https://github.com/r33drichards/wasmcraft/releases/latest/download/picat.wasm
kind: session
