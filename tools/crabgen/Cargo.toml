[package]
name = "crabgen"
version = "0.1.0"
edition = "2021"
description = "WIT-driven guest project generator for crabcraft"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wit-parser = { version = "0.251", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
